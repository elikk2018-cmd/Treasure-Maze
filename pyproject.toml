[tool.poetry]
name = "labyrinth-game"  
version = "0.1.0"
description = "Текстовая adventure игра 'Лабиринт сокровищ'"
authors = ["Елизаровы <your.email@example.com>"]
readme = "README.md"

[tool.poetry.scripts]
project = "labyrinth_game.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

packages = [
    { include = "labyrinth_game" },
]

[tool.poetry.group.dev.dependencies]
ruff = "^0.13.2"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []